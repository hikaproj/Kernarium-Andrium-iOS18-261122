# SPDX-License-Identifier: GPL-2.0-or-later
name: Build and Release iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_app:
        description: 'Application to build'
        required: true
        type: choice
        default: 'both'
        options:
          - 'both'
          - 'Kernarium'
          - 'Andarium'
      configuration:
        description: 'Build Configuration'
        required: true
        type: choice
        default: 'Release'
        options:
          - 'Release'
          - 'AppStore'
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish IPAs
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          echo "Xcode Version:"
          xcodebuild -version

      - name: Install build tools
        run: |
          brew install cmake ninja

      - name: Setup Code Signing (Optional)
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p GuestHost/Config
          if [ -n "${DEVELOPMENT_TEAM:-}" ]; then
            echo "Setting DEVELOPMENT_TEAM..."
            echo "DEVELOPMENT_TEAM = ${DEVELOPMENT_TEAM}" > GuestHost/Config/Signing.local.xcconfig
          else
            echo "No DEVELOPMENT_TEAM secret provided; using empty team for unsigned build."
            echo "DEVELOPMENT_TEAM = " > GuestHost/Config/Signing.local.xcconfig
          fi

          if [ -n "${CERTIFICATE_BASE64:-}" ] && [ -n "${CERTIFICATE_PASSWORD:-}" ]; then
            echo "Configuring signing keychain from secret..."
            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
            KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            CERT_FILE="$RUNNER_TEMP/certificate.p12"
            echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_FILE"
            security import "$CERT_FILE" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

            if [ -n "${PROVISIONING_PROFILE_BASE64:-}" ]; then
              echo "Installing provisioning profile..."
              PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
              mkdir -p "$PROFILE_DIR"
              echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/profile.mobileprovision"
            fi
          else
            echo "No signing certificate secret configured: build will produce unsigned/ad-hoc IPAs suitable for sideloading."
          fi

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            .build/dependency-cache
            .build/dependencies
            .build/kernel/artifacts
            .build/android/releases
          key: ${{ runner.os }}-build-cache-${{ hashFiles('dependencies/manifest.tsv', 'android/lineage-24/metadata/accepted-release.env') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-

      - name: Fetch prebuilt release assets if available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting to download prebuilt artifacts from existing GitHub Releases..."
          mkdir -p .build/downloads .build/kernel/artifacts .build/android/releases
          gh release download --repo "${{ github.repository }}" \
            --pattern "*kernel*" \
            --pattern "*artifact*" \
            --pattern "*lineage24*" \
            --pattern "*mainline-6.18*" \
            --dir ".build/downloads" 2>/dev/null || true

          for f in .build/downloads/*.tar.gz .build/downloads/*.tgz; do
            if [ -f "$f" ]; then
              echo "Extracting tarball: $f"
              tar -xzf "$f" -C .build/ 2>/dev/null || true
            fi
          done

          for f in .build/downloads/*.zip; do
            if [ -f "$f" ]; then
              echo "Extracting zip: $f"
              unzip -q -o "$f" -d .build/ 2>/dev/null || true
            fi
          done

      - name: Build and Package IPAs
        run: |
          chmod +x scripts/build-ipa.sh
          TARGET_APP="${{ github.event.inputs.target_app || 'both' }}"
          CONFIG="${{ github.event.inputs.configuration || 'Release' }}"
          ./scripts/build-ipa.sh --app "$TARGET_APP" --configuration "$CONFIG" --output-dir dist

      - name: Upload IPAs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-release
          path: |
            dist/*.ipa
            dist/*.dSYM.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            TAG="v$(date +'%Y.%m.%d-%H%M%S')"
            echo "Workflow dispatched manually. Creating tag $TAG..."
            git tag "$TAG"
            git push origin "$TAG" || true
          fi

          RELEASE_FLAGS=()
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then
            RELEASE_FLAGS+=("--draft")
          fi
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            RELEASE_FLAGS+=("--prerelease")
          fi

          TITLE="Release $TAG"

          # Collect assets to publish
          ASSETS=(dist/*.ipa dist/SHA256SUMS.txt)
          for dsym in dist/*.dSYM.zip; do
            if [ -f "$dsym" ]; then
              ASSETS+=("$dsym")
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --title "$TITLE" \
              --generate-notes \
              "${RELEASE_FLAGS[@]}"
          fi
